{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="card shadow-sm col-md-7"><div class="card-body">
  <h1 class="h4">My Profile</h1>
  <p><strong>Username:</strong> {{ me.user.username }}</p>
  <form method="post">
    <div class="mb-3"><label class="form-label">Name</label>
      <input class="form-control" name="name" value="{{ me.name }}" required></div>
    <div class="mb-3"><label class="form-label">Contact number</label>
      <input class="form-control" name="contact_no" value="{{ me.contact_no or '' }}"></div>
    <div class="mb-3"><label class="form-label">Department</label>
      <input class="form-control" name="department" value="{{ me.department or '' }}"></div>
    <button class="btn btn-primary">Save</button>
  </form>
</div></div>
{% endblock %}
