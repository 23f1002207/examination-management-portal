{% extends "base.html" %}
{% block title %}Examiner Dashboard{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Welcome, {{ me.name }}</h1>
<div class="row g-3">
  {% for label, value in stats.items() %}
  <div class="col-sm-6 col-lg-4"><div class="card stat-card shadow-sm text-center"><div class="card-body">
    <div class="display-6">{{ value }}</div><div class="text-muted">{{ label }}</div>
  </div></div></div>
  {% endfor %}
</div>
{% endblock %}
