{% extends "base.html" %}
{% block title %}Edit Rubric{% endblock %}
{% block content %}
<div class="card shadow-sm col-md-7"><div class="card-body">
  <h1 class="h4 mb-3">Edit criterion ({{ rubric.exam.name }})</h1>
  <form method="post">
    <div class="mb-3"><label class="form-label">Name</label>
      <input class="form-control" name="name" value="{{ rubric.name }}" required></div>
    <div class="row mb-3">
      <div class="col"><label class="form-label">Weightage %</label>
        <input class="form-control" type="number" step="any" min="0" name="weightage" value="{{ rubric.weightage }}" required></div>
      <div class="col"><label class="form-label">Max marks</label>
        <input class="form-control" type="number" step="any" min="0" name="max_marks" value="{{ rubric.max_marks }}" required></div>
    </div>
    <div class="mb-3"><label class="form-label">Description</label>
      <textarea class="form-control" name="description" rows="3">{{ rubric.description or '' }}</textarea></div>
    <button class="btn btn-primary">Save</button>
    <a class="btn btn-link" href="{{ url_for('admin.exam_rubrics', exam_id=rubric.exam_id) }}">Cancel</a>
  </form>
</div></div>
{% endblock %}
