{% extends "base.html" %}
{% block title %}Course{% endblock %}
{% block content %}
<div class="card shadow-sm col-md-7"><div class="card-body">
  <h1 class="h4 mb-3">{{ 'Edit' if course else 'Add' }} Course</h1>
  <form method="post">
    <div class="mb-3"><label class="form-label">Course code</label>
      <input class="form-control" name="code" value="{{ course.code if course else request.form.get('code', '') }}" {% if course %}readonly{% else %}required{% endif %}></div>
    <div class="mb-3"><label class="form-label">Course name</label>
      <input class="form-control" name="name" value="{{ course.name if course else request.form.get('name', '') }}" required></div>
    <div class="mb-3"><label class="form-label">Description</label>
      <textarea class="form-control" name="description" rows="3">{{ course.description if course and course.description else request.form.get('description', '') }}</textarea></div>
    <button class="btn btn-primary">Save</button>
    <a class="btn btn-link" href="{{ url_for('admin.courses') }}">Cancel</a>
  </form>
</div></div>
{% endblock %}
