{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="row g-4">
  <div class="col-md-6"><div class="card shadow-sm"><div class="card-body">
    <h1 class="h4">My Profile</h1>
    <p class="mb-3"><strong>Username:</strong> {{ me.user.username }}</p>
    <form method="post">
      <div class="mb-3"><label class="form-label">Name</label>
        <input class="form-control" name="name" value="{{ me.name }}" required></div>
      <div class="mb-3"><label class="form-label">Contact</label>
        <input class="form-control" name="contact" value="{{ me.contact or '' }}"></div>
      <button class="btn btn-primary">Save</button>
    </form>
  </div></div></div>
  <div class="col-md-6"><div class="card shadow-sm border-warning"><div class="card-body">
    <h2 class="h5">Create New Admin</h2>
    <p class="text-muted">Only one Admin can be active. Creating a new Admin makes <strong>your account inactive</strong>.</p>
    <form method="post" action="{{ url_for('admin.create_admin') }}">
      <div class="mb-3"><label class="form-label">New admin name</label>
        <input class="form-control" name="name"></div>
      <div class="mb-3"><label class="form-label">Contact</label>
        <input class="form-control" name="contact"></div>
      <button class="btn btn-warning">Create New Admin</button>
    </form>
  </div></div></div>
</div>
{% endblock %}
