{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="card shadow-sm col-md-7"><div class="card-body">
  <h1 class="h4">My Profile</h1>
  <p><strong>Username:</strong> {{ me.user.username }}</p>
  <form method="post">
    <div class="mb-3"><label class="form-label">Name</label>
      <input class="form-control" name="name" value="{{ me.name }}" required></div>
    <div class="row mb-3">
      <div class="col"><label class="form-label">Class</label><input class="form-control" name="class_name" value="{{ me.class_name or '' }}"></div>
      <div class="col"><label class="form-label">Section</label><input class="form-control" name="section" value="{{ me.section or '' }}"></div>
      <div class="col"><label class="form-label">Academic year</label><input class="form-control" name="academic_year" value="{{ me.academic_year or '' }}"></div>
    </div>
    <button class="btn btn-primary">Save</button>
  </form>
</div></div>
{% endblock %}
